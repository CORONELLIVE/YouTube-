<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader Pro</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial}body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#10101b,#24162e);margin:0;color:#fff}
main{box-sizing:border-box;width:min(94vw,560px);padding:36px;border:1px solid #51435c;border-radius:24px;background:#201d2c;box-shadow:0 24px 70px #0006}
h1{margin:0 0 10px}p{color:#c7bed0;line-height:1.5}label{display:block;margin:22px 0 8px}
input,select,button{box-sizing:border-box;width:100%;padding:15px;border-radius:12px;font:inherit}
input,select{border:1px solid #675875;background:#15121e;color:white}
button{margin-top:24px;background:#e93d63;color:white;border:0;cursor:pointer;font-weight:700}
button:disabled{opacity:.6;cursor:wait}#status{min-height:24px}
</style></head><body><main><h1>▶ YouTube Downloader Pro</h1><p>Descarga videos o extrae audio de contenido propio o autorizado.</p>
<form id="form"><label for="url">Enlace de YouTube</label><input id="url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
<label for="mode">Formato</label><select id="mode" name="mode"><option value="video">Video — mejor calidad disponible</option><option value="audio">Audio — MP3</option></select>
<button id="button">Descargar</button></form><p id="status" role="status"></p>
</main><script>
const form=document.querySelector("#form"),status=document.querySelector("#status"),button=document.querySelector("#button");
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;status.textContent="Preparando descarga…";
try{const response=await fetch("/download",{method:"POST",body:new FormData(form)});
if(!response.ok){let data=await response.json();throw Error(data.error||"Error al descargar");}
const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");
const disposition=response.headers.get("Content-Disposition")||"";
const match=disposition.match(/filename\*=UTF-8''([^;]+)/i)||disposition.match(/filename="?([^";]+)"?/i);
a.href=url;a.download=match?decodeURIComponent(match[1]):"descarga";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent="Descarga iniciada.";
}catch(err){status.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
